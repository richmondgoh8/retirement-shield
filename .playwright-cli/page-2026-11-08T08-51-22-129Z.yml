            - paragraph [ref=e398]: Make investments easier to spend later
            - heading "A drawdown plan for the years after work." [level=2] [ref=e400]
          - paragraph [ref=e401]: If you hold a broad share fund such as VWRA, build a written transition plan over time. A retirement date does not require selling everything at once.
        - generic [ref=e402]:
          - generic [ref=e403]:
            - article [ref=e404]:
              - generic [ref=e405]: "01"
              - generic [ref=e406]:
                - heading "Calculate the gap first" [level=3] [ref=e407]
                - paragraph [ref=e408]: Use the monthly plan above. Size investments against spending left after CPF LIFE and any other steady income.
            - article [ref=e409]:
              - generic [ref=e410]: "02"
              - generic [ref=e411]:
                - heading "Set an accessible spending reserve" [level=3] [ref=e412]
                - paragraph [ref=e413]: Choose how many months of your investment-funded gap to hold in cash or similarly accessible savings, based on comfort and upcoming costs.
            - article [ref=e414]:
              - generic [ref=e415]: "03"
              - generic [ref=e416]:
                - heading "Build a fixed-income ladder gradually" [level=3] [ref=e417]
                - paragraph [ref=e418]: Match maturities to planned spending. Singapore Savings Bonds can be redeemed monthly without a penalty; allow for processing time, so they are not instant cash.
            - article [ref=e419]:
              - generic [ref=e420]: "04"
              - generic [ref=e421]:
                - heading "Keep long-horizon money invested" [level=3] [ref=e422]
                - paragraph [ref=e423]: Keep an equity allocation you can tolerate through market falls. Rebalance on a set schedule and use a written rule for replenishing cash after stronger markets.
          - complementary [ref=e424]:
            - generic [ref=e425]: SINGAPORE SAVINGS BONDS
            - strong [ref=e426]: $200,000
            - generic [ref=e427]: maximum holding per individual across cash and SRS
            - paragraph [ref=e428]: Buy in $500 multiples. You can request redemption monthly, with no penalty; proceeds are paid after processing in the following month. Keep near-term bills in a more immediately accessible account.
            - 'link "MAS: SSB limits and redemption ↗" [ref=e429] [cursor=pointer]':

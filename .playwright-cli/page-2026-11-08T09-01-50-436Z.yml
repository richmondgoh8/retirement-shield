            - generic "Page Content" [ref=e36]:
              - generic [ref=e37]:
                - paragraph [ref=e38]: Income from employment is a key indicator of economic well-being.
                - paragraph [ref=e39]:
                  - text: Gross monthly income from employment is the widest measure of income from employment, covering both employees and the self-employed. For income of a typical worker, look at the
                  - emphasis [ref=e40]: median
                  - text: gross monthly income. This is the income in the middle, after the workers are ranked by their income.
                - paragraph [ref=e41]: The quarterly average monthly earnings (AME) has been replaced with the quarterly average mean gross monthly income (GMI) from employment. The GMI provides broader coverage by including both salaried and self-employed individuals. Unlike the AME, which incorporates bonuses, the GMI excludes them, offering a clearer reflection of actual income trends for short-term comparisons.
                - paragraph [ref=e42]: The quarterly mean gross monthly income provides a timely gauge of average wage movement. The change in mean gross monthly income (change in income per worker) is a suitable statistic for comparison with the change in labour productivity (change in value-added per worker) as both are expressed on a “per worker” basis.
                - paragraph [ref=e43]: If you are interested in wage increases that employers give over the year, then look at the annual wage changes. This indicator provides a breakdown of changes in total wages into basic wages and bonuses.
                - paragraph [ref=e44]: As part of MRSD’s continued commitment to deliver accurate and relevant statistics on the labour market, our data collection processes have undergone an assessment by Ernst and Young Advisory Pte Ltd.

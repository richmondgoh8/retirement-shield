              - paragraph [ref=e120]:
                - strong [ref=e121]: "Source:"
                - text: Gross Monthly Income From Employment - Comprehensive Labour Force Survey, Manpower Research & Statistics Department, MOM
                - strong [ref=e122]: "Latest figures published in:"
                - link "Labour Force in Singapore" [ref=e123] [cursor=pointer]:
                  - /url: /Pages/Labour-Force-In-Singapore-2025.aspx
              - strong [ref=e124]: "Notes:"
              - list [ref=e126]:
                - listitem [ref=e127]: Data exclude full-time National Servicemen.
                - listitem [ref=e128]: Data are for mid-year.
                - listitem [ref=e129]: Residents refer to Singapore Citizens and Permanent Residents.
                - listitem [ref=e130]: Gross monthly income from employment refers to income earned from employment. For employees, it refers to the gross monthly wages or salaries before deduction of employee CPF contributions and personal income tax. It comprises basic wages, overtime pay, commissions, tips, other allowances. For self-employed persons, gross monthly income refers to the average monthly profits from their business, trade or profession (i.e. total receipts less business expenses incurred) before deduction of income tax and platform workers’ share of CPF contributions.
                - listitem [ref=e131]: As data are captured from a sample survey, year-on-year income changes are prone to fluctuations and hence should always be interpreted with caution. Income growth studied over longer periods (e.g. 5 or 10 years) smooths out these fluctuations and hence provides a more direct indication of income growth.
                - listitem [ref=e132]: Data include one-twelfth of annual bonuses.
                - listitem [ref=e133]: ^ Deflated by Consumer Price Index (CPI) for all items at 2024 prices (2024 = 100).

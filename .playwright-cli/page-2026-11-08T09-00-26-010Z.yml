              - text: THE 1M65 IDEA
              - heading "A milestone, not a required target." [level=3] [ref=e295]
          - paragraph [ref=e296]: “1M65” describes one possible CPF accumulation journey. Your useful target is the monthly income your own budget needs. At 55, CPF creates an RA and transfers savings under the rules for your cohort; check your own forecast and housing needs before voluntary top-ups or transfers.

    - region "A drawdown plan for the years after work." [ref=e298]:
      - generic [ref=e299]:
        - generic [ref=e300]:
          - generic [ref=e301]:
            - paragraph [ref=e302]: Make investments easier to spend later
            - heading "A drawdown plan for the years after work." [level=2] [ref=e304]
          - paragraph [ref=e305]: If you hold a broad share fund such as VWRA, build a written transition plan over time. A retirement date does not require selling everything at once.
        - generic [ref=e306]:
          - generic [ref=e307]:
            - article [ref=e308]:
              - generic [ref=e309]: "01"
              - generic [ref=e310]:
                - heading "Calculate the gap first" [level=3] [ref=e311]
                - paragraph [ref=e312]: Use the monthly plan above. Size investments against spending left after CPF LIFE and any other steady income.
            - article [ref=e313]:
              - generic [ref=e314]: "02"
              - generic [ref=e315]:
                - heading "Set an accessible spending reserve" [level=3] [ref=e316]
                - paragraph [ref=e317]: Choose how many months of your investment-funded gap to hold in cash or similarly accessible savings, based on comfort and upcoming costs.
            - article [ref=e318]:
              - generic [ref=e319]: "03"
              - generic [ref=e320]:
                - heading "Build a fixed-income ladder gradually" [level=3] [ref=e321]
                - paragraph [ref=e322]: Match maturities to planned spending. Singapore Savings Bonds can be redeemed monthly without a penalty; allow for processing time, so they are not instant cash.
            - article [ref=e323]:
              - generic [ref=e324]: "04"
              - generic [ref=e325]:
                - heading "Keep long-horizon money invested" [level=3] [ref=e326]
                - paragraph [ref=e327]: Keep an equity allocation you can tolerate through market falls. Rebalance on a set schedule and use a written rule for replenishing cash after stronger markets.
          - complementary [ref=e328]:
            - generic [ref=e329]: SINGAPORE SAVINGS BONDS
            - strong [ref=e330]: $200,000
            - generic [ref=e331]: maximum holding per individual across cash and SRS
            - paragraph [ref=e332]: Buy in $500 multiples. You can request redemption monthly, with no penalty; proceeds are paid after processing in the following month. Keep near-term bills in a more immediately accessible account.
            - 'link "MAS: SSB limits and redemption ↗" [ref=e333] [cursor=pointer]':
              - /url: https://www.mas.gov.sg/contact-us/faqs/singapore-savings-bonds-faqs
        - paragraph [ref=e334]: There is no universal “sell VWRA at age X” rule. Decide in advance what the money is for, which spending years are covered by cash and bonds, and when you will rebalance. Investment values and bond rates can change.

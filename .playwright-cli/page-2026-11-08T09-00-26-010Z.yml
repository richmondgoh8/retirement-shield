        - generic "Practical retirement planning steps" [ref=e211]:
          - heading "Your next four moves" [level=3] [ref=e212]
          - generic [ref=e213]:
            - article [ref=e214]:
              - generic [ref=e215]: FIRST
              - strong [ref=e216]: Clear expensive debt and keep emergency money accessible.
              - generic [ref=e217]: Do this before locking cash away or investing money you may need soon.
            - article [ref=e218]:
              - generic [ref=e219]: CPF PRIORITY
              - strong [ref=e220]: Check your CPF LIFE forecast and eligible retirement sum target.
              - generic [ref=e221]: If building CPF first suits your plan, consider eligible top-ups or transfers before extra investing. Check liquidity and housing needs; top-ups are generally hard to reverse.
            - article [ref=e222]:
              - generic [ref=e223]: THEN
              - strong [ref=e224]: Invest the monthly amount needed for the remaining gap.
              - generic [ref=e225]: Use the monthly target above as your starting amount; adjust for fees, risk and what you can sustain.
            - article [ref=e226]:
              - generic [ref=e227]: AS RETIREMENT NEARS
              - strong [ref=e228]: Gradually match near-term withdrawals with cash and bond maturities.
              - generic [ref=e229]: Review once a year and avoid making the whole transition on one market date.
